[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dascan-desktop"
version = "0.1.0"
description = "DAScan PySide6 desktop client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "paramiko>=3.4,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "ruff>=0.6"]

[project.scripts]
dascan = "plotdas_client.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001", "DTZ001"]
